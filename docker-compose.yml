services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: sovio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sovio-db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - sovio-network

  # Backend (Express.js con Babel)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sovio-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sovio-db
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongodb
    networks:
      - sovio-network
    command: npm run dev

  # Frontend Client (Usuarios)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sovio-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    networks:
      - sovio-network
    command: npm run dev -- --host --port 5173

  # Frontend Admin (Administradores)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: sovio-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    networks:
      - sovio-network
    command: npm run dev -- --host --port 5174

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_node_modules:
    driver: local
  client_node_modules:
    driver: local
  admin_node_modules:
    driver: local

networks:
  sovio-network:
    driver: bridge